<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="QRipple — 实时二维码共享。Scan once. Share everywhere.">
  <title>QRipple</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Filled in by the server with the access lines (see server/static.js). -->
  <meta name="qripple-lines" content="">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-link>
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="9" y="9" width="14" height="14" rx="3" class="mark-core"/>
        <rect x="12.5" y="12.5" width="3" height="3" class="mark-dot"/>
        <rect x="16.5" y="16.5" width="3" height="3" class="mark-dot"/>
        <path d="M5 11a11 11 0 0 1 6-6M27 21a11 11 0 0 1-6 6M21 5a11 11 0 0 1 6 6M11 27a11 11 0 0 1-6-6" class="mark-ripple"/>
      </svg>
      <span>QRipple</span>
    </a>
    <div class="topbar-actions">
      <a class="topbar-btn topbar-icon" href="https://github.com/InkCitrus/QRipple" target="_blank" rel="noopener" data-i18n-attr="aria-label:common.github;title:common.github">
        <svg class="github-mark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </a>
      <button type="button" class="topbar-btn topbar-icon" id="settings-open" hidden data-i18n-attr="aria-label:settings.open;title:settings.open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button type="button" class="topbar-btn" id="lang-toggle">EN</button>
    </div>
  </header>

  <main id="app">
    <!-- Home -->
    <section class="view" data-view="home" hidden>
      <div class="hero">
        <h1 class="hero-title">QRipple</h1>
        <p class="hero-tagline" data-i18n="home.tagline"></p>
        <p class="hero-desc" data-i18n="home.desc"></p>
      </div>
      <div class="choices">
        <a class="choice choice-share" href="/share" data-link>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/></svg>
          <span class="choice-title" data-i18n="home.share"></span>
          <span class="choice-sub" data-i18n="home.shareSub"></span>
        </a>
        <a class="choice choice-join" href="/join" data-link>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>
          <span class="choice-title" data-i18n="home.join"></span>
          <span class="choice-sub" data-i18n="home.joinSub"></span>
        </a>
      </div>
      <ul class="facts">
        <li data-i18n="home.fact1"></li>
        <li data-i18n="home.fact2"></li>
        <li data-i18n="home.fact3"></li>
      </ul>
    </section>

    <!-- Share -->
    <section class="view view-share" data-view="share" hidden>
      <div class="share-grid" id="share-main">
        <div class="card code-card">
          <div class="card-label" data-i18n="share.codeLabel"></div>
          <div class="pair-code" id="share-code" aria-live="polite">-----</div>
          <div class="status-row">
            <span class="chip" id="share-conn"></span>
            <span class="chip chip-neutral" id="share-receivers"></span>
          </div>
        </div>

        <div class="card camera-card">
          <div class="camera" id="camera">
            <video id="camera-video" playsinline muted autoplay></video>
            <div class="viewfinder" id="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <div class="code-markers" id="code-markers" hidden>
              <svg class="code-outlines" id="code-outlines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
            </div>
            <div class="camera-message" id="camera-message" hidden>
              <p id="camera-message-text"></p>
              <button type="button" class="btn btn-small" id="camera-retry" data-i18n="share.retryCamera"></button>
            </div>
            <div class="camera-bar">
              <span class="scan-pill" id="scan-status" aria-live="polite"></span>
              <div class="camera-actions">
              <button type="button" class="zoom-badge" id="camera-zoom" hidden data-i18n-attr="aria-label:share.zoomReset;title:share.zoomReset"></button>
              <button type="button" class="icon-btn" id="camera-switch" hidden data-i18n-attr="aria-label:share.switchCamera">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><path d="M9 13a3 3 0 0 0 5.5 1.5M15 12a3 3 0 0 0-5.5-1.5M14.5 16v-1.5H16M9.5 8v1.5H8"/></svg>
              </button>
              </div>
            </div>
          </div>
          <div class="code-choices" id="code-choices" hidden>
            <p class="code-choices-title" data-i18n="share.chooseTitle"></p>
            <div class="code-choices-list" id="code-choices-list"></div>
          </div>
        </div>

        <div class="card content-card" id="share-content-card">
          <div class="card-label" data-i18n="share.currentLabel"></div>
          <p class="content-preview empty" id="share-content" data-i18n="share.noContent"></p>
          <div class="content-meta" id="share-meta"></div>
          <div class="content-actions">
            <button type="button" class="btn btn-secondary btn-small" id="share-copy" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
              <span data-i18n="common.copy"></span>
            </button>
            <button type="button" class="btn btn-secondary btn-small launch-share" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
              <span data-i18n="launch.share"></span>
            </button>
            <button type="button" class="btn btn-secondary btn-small launch-run" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8 10H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>
              <span class="launch-label"></span>
            </button>
          </div>
          <p class="launch-share-note" hidden></p>
          <p class="launch-note" hidden>
            <span class="launch-target"></span>
            <button type="button" class="link-btn launch-change" data-i18n="launch.change"></button>
          </p>
        </div>

        <button type="button" class="btn btn-danger btn-block" id="share-end" data-i18n="share.end"></button>
      </div>

      <div class="card ended-card" id="share-ended" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <h2 id="share-ended-title"></h2>
        <p id="share-ended-text"></p>
        <a class="btn btn-primary" href="/share" data-link data-reset data-i18n="share.startNew"></a>
        <a class="btn btn-ghost" href="/" data-link data-i18n="common.home"></a>
      </div>
    </section>

    <!-- Join -->
    <section class="view view-join" data-view="join" hidden>
      <form class="card join-form" id="join-form" novalidate>
        <label class="card-label" for="join-code" data-i18n="join.codeLabel"></label>
        <input id="join-code" class="code-input" name="code" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="5" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="•••••" required>
        <p class="form-error" id="join-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="join-submit" data-i18n="join.submit"></button>
        <p class="hint" data-i18n="join.hint"></p>
      </form>

      <div class="join-session" id="join-session" hidden>
        <div class="card session-bar">
          <div>
            <div class="card-label" data-i18n="join.sessionLabel"></div>
            <div class="session-code" id="join-session-code"></div>
          </div>
          <div class="status-row">
            <span class="chip" id="join-conn"></span>
          </div>
        </div>

        <div class="banner" id="join-banner" hidden></div>

        <div class="card qr-card">
          <div class="qr-frame" id="qr-frame">
            <div class="qr-placeholder" id="qr-placeholder">
              <div class="spinner" aria-hidden="true"></div>
              <p data-i18n="join.waiting"></p>
            </div>
          </div>
          <div class="qr-meta" id="qr-meta"></div>
        </div>

        <div class="card content-card" id="join-content-card" hidden>
          <div class="card-label" data-i18n="join.contentLabel"></div>
          <p class="content-preview" id="join-content"></p>
          <div class="content-actions">
            <button type="button" class="btn btn-secondary" id="join-copy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
              <span data-i18n="common.copy"></span>
            </button>
            <button type="button" class="btn btn-secondary launch-share" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
              <span data-i18n="launch.share"></span>
            </button>
            <button type="button" class="btn btn-secondary launch-run" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8 10H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>
              <span class="launch-label"></span>
            </button>
          </div>
          <p class="launch-share-note" hidden></p>
          <p class="launch-note" hidden>
            <span class="launch-target"></span>
            <button type="button" class="link-btn launch-change" data-i18n="launch.change"></button>
          </p>
        </div>

        <button type="button" class="btn btn-ghost btn-block" id="join-leave" data-i18n="join.leave"></button>
      </div>

      <div class="card ended-card" id="join-ended" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        <h2 id="join-ended-title"></h2>
        <p id="join-ended-text"></p>
        <a class="btn btn-primary" href="/join" data-link data-reset data-i18n="join.joinAnother"></a>
        <a class="btn btn-ghost" href="/" data-link data-i18n="common.home"></a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="settings" id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="settings-form">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <label class="switch-row">
        <span class="switch-text">
          <span class="switch-title" data-i18n="settings.shortcut"></span>
          <span class="settings-hint" data-i18n="settings.shortcutDesc"></span>
        </span>
        <input type="checkbox" class="switch" id="settings-shortcut" role="switch">
      </label>
      <div class="settings-field" id="settings-shortcut-field" hidden>
        <label class="card-label" for="settings-shortcut-name" data-i18n="settings.shortcutName"></label>
        <input type="text" class="text-input" id="settings-shortcut-name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <p class="settings-hint" data-i18n="settings.shortcutNameHint"></p>
      </div>
      <button class="btn btn-primary btn-block" data-i18n="settings.done"></button>
    </form>
  </dialog>

  <footer class="footer">
    <span data-i18n="common.privacy"></span>
  </footer>
</body>
</html>
